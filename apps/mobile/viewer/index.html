<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6" />
    <style>
      html,
      body {
        margin: 0;
        background: #1c1f24;
        color: #e7e9ec;
        font-family: sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 10px 0 60px;
      }
      .page {
        position: relative;
        width: calc(100vw - 16px);
        background: #f4f1ea;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      .page canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #indicator {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 14px;
        background: rgba(35, 39, 46, 0.9);
        font-size: 13px;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #indicator.hidden {
        opacity: 0;
      }
      #message {
        padding: 40px 24px;
        text-align: center;
        color: #9aa3ad;
      }
    </style>
  </head>
  <body>
    <div id="pages"></div>
    <div id="indicator" class="hidden"></div>
    <script src="viewer.js"></script>
  </body>
</html>
